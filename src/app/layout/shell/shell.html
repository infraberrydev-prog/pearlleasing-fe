<!-- First tab stop: jump past the navigation. -->
<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>

<div class="rail-slot">
  <app-sidebar
    class="sidebar"
    [expanded]="sidebarExpanded()"
    [cdkTrapFocus]="sidebarExpanded()"
    (toggled)="toggleSidebar()"
    (navigated)="closeSidebar()"
    (logoutRequested)="requestLogout()"
  />
</div>

@if (sidebarExpanded()) {
  <div class="backdrop" aria-hidden="true" (click)="closeSidebar()"></div>
}

<main class="main" id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-bottom-nav class="bottom-nav" />
