@if (label()) {
  <div class="label-row">
    <label class="label" [for]="inputId()">
      {{ label() }}
      @if (required()) {
        <span class="required" aria-hidden="true">*</span>
      } @else if (optional()) {
        <em class="optional">(optional)</em>
      }
    </label>
    <ng-content select="[labelAction]" />
  </div>
}

<div class="control">
  @if (leadingIcon(); as icon) {
    <app-icon [name]="icon" />
  }
  @if (prefix(); as text) {
    <span class="prefix" [class.is-empty]="!value()" aria-hidden="true">{{ text }}</span>
  }
  <input
    [id]="inputId()"
    [type]="effectiveType()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.autocomplete]="autocomplete()"
    [attr.list]="list() ?? null"
    [attr.inputmode]="inputmode() ?? null"
    [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
    [attr.aria-invalid]="invalid()"
    [attr.aria-describedby]="describedBy()"
    (input)="handleInput($event)"
    (blur)="onTouched()"
  />
  <ng-content select="[trailing]" />
  @if (isPassword()) {
    <button
      type="button"
      class="toggle"
      [disabled]="isDisabled()"
      [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="passwordVisible()"
      [attr.aria-controls]="inputId()"
      (click)="passwordVisible.set(!passwordVisible())"
    >
      <app-icon [name]="passwordVisible() ? 'eye-open' : 'eye-closed'" />
    </button>
  }
</div>

@if (error()) {
  <p class="message message--error" [id]="inputId() + '-desc'">{{ error() }}</p>
} @else if (hint()) {
  <p class="message" [id]="inputId() + '-desc'">{{ hint() }}</p>
}
