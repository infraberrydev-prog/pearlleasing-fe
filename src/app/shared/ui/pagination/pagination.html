<button
  app-button
  type="button"
  variant="secondary"
  size="sm"
  [disabled]="page() <= 1"
  (click)="go(page() - 1)"
>
  Previous
</button>

<ol class="pages">
  @for (item of items(); track $index) {
    <li>
      @if (item === 'gap') {
        <span class="page gap" aria-hidden="true">...</span>
      } @else {
        <button
          type="button"
          class="page"
          [class.is-current]="item === page()"
          [attr.aria-current]="item === page() ? 'page' : null"
          [attr.aria-label]="'Page ' + item"
          (click)="go(item)"
        >
          {{ item }}
        </button>
      }
    </li>
  }
</ol>

<span class="compact" aria-live="polite">Page {{ page() }} of {{ pageCount() }}</span>

<button
  app-button
  type="button"
  variant="secondary"
  size="sm"
  [disabled]="page() >= pageCount()"
  (click)="go(page() + 1)"
>
  Next
</button>
