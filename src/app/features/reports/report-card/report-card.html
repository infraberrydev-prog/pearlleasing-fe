<app-checkbox
  class="select"
  [ariaLabel]="'Select ' + report().id"
  [checked]="selected()"
  (checkedChange)="selected.set($event)"
/>

<div class="body">
  <div class="head">
    <div class="id-row">
      <button type="button" class="report-id" (click)="viewed.emit()">{{ report().id }}</button>
      @if (compact()) {
        <button
          type="button"
          class="icon-btn"
          [attr.aria-label]="'Actions for ' + report().id"
          [cdkMenuTriggerFor]="actions"
        >
          <app-icon name="dot-vertical-01">⋮</app-icon>
        </button>
      } @else {
        <span class="actions">
          <button type="button" class="icon-btn" [attr.aria-label]="'View ' + report().id" (click)="previewed.emit()">
            <app-icon name="eye-open" />
          </button>
          @if (canDelete()) {
            <button type="button" class="icon-btn" [attr.aria-label]="'Delete ' + report().id" (click)="deleted.emit()">
              <app-icon name="trash-03" />
            </button>
          }
        </span>
      }
    </div>
    <p class="name">{{ report().name }}</p>
  </div>

  <div class="details">
    <div class="amount">
      <span class="label">{{ amountLabel() }}</span>
      <span class="amount-value">{{ report().amount | peso }}</span>
    </div>
    <hr class="divider" />
    <dl class="dates">
      <div>
        <dt>Date &amp; Time Created</dt>
        <dd>{{ report().createdAt | reportDate }}</dd>
      </div>
      <div>
        <dt>Last Updated</dt>
        <dd>{{ report().updatedAt | reportDate }}</dd>
      </div>
    </dl>
  </div>
</div>

<ng-template #actions>
  <app-menu>
    <button app-menu-item (triggered)="previewed.emit()"><app-icon name="eye-open" />View</button>
    @if (canDelete()) {
      <button app-menu-item (triggered)="deleted.emit()"><app-icon name="trash-03" />Delete</button>
    }
  </app-menu>
</ng-template>
