<form class="card" [formGroup]="form" (submit)="$event.preventDefault(); submit()" novalidate>
  <header class="top-bar">
    <button type="button" class="back" aria-label="Back to Expenses Reports" (click)="leave()">
      <app-icon name="chevron-left" />
    </button>
    <h1 class="title">{{ title() }}</h1>
  </header>

  <div class="content">
    @if (editor().error; as error) {
      <app-alert tone="error">{{ error }}</app-alert>
    }

    @if (isDetail && editor().loading) {
      <p class="loading" role="status">Loading report…</p>
    } @else {
      <p class="intro">Provide the necessary details to complete this report.</p>

      <app-input-field
        class="report-name"
        label="Report Name"
        required
        placeholder="Enter Report name"
        formControlName="name"
        [error]="error('name', 'Report Name')"
      />

      <app-divider />

      <fieldset class="expenses">
        <legend>Expenses</legend>
        <div class="grid">
          @for (field of fields; track field.key) {
            <app-input-field
              [label]="field.label"
              required
              placeholder="₱ 00.00"
              inputmode="decimal"
              [formControlName]="field.key"
              [error]="error(field.key, field.label)"
            />
          }
        </div>
      </fieldset>

      <div class="total" aria-live="polite">Total Amount: {{ total() }}</div>
    }
  </div>

  <footer class="footer">
    <button app-button type="button" variant="danger-subtle" (click)="discard()">
      {{ isDetail ? 'Cancel' : 'Discard' }}
    </button>
    <button app-button type="submit" [disabled]="!canSubmit()" [attr.aria-busy]="editor().saving">
      {{ isDetail ? 'Update Report' : 'Submit Report' }}
    </button>
  </footer>
</form>
